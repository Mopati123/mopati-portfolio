<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mopati Ramaologa engineering profile</title>
  <desc id="desc">Quantum-inspired banner representing systems architecture, algorithmic trading, governed AI and evidence-native software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040912"/>
      <stop offset="0.48" stop-color="#08182a"/>
      <stop offset="1" stop-color="#110b24"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#c8f8ff" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#72e6ff" stop-opacity="0.72"/>
      <stop offset="0.58" stop-color="#6f83ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050b13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#72e6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#72e6ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="1000" cy="92" rx="290" ry="220" fill="url(#core)" opacity="0.72"/>
  <g fill="none" stroke-width="1.4">
    <ellipse cx="1000" cy="176" rx="180" ry="76" stroke="#72e6ff" stroke-opacity="0.48" transform="rotate(-16 1000 176)"/>
    <ellipse cx="1000" cy="176" rx="218" ry="98" stroke="#b48cff" stroke-opacity="0.36" transform="rotate(21 1000 176)"/>
    <ellipse cx="1000" cy="176" rx="142" ry="142" stroke="#72e6ff" stroke-opacity="0.22" stroke-dasharray="7 10"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="1000" cy="176" r="34" fill="#091a2b" stroke="#72e6ff" stroke-width="1.5"/>
    <text x="1000" y="183" text-anchor="middle" fill="#eafaff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">Hₜ</text>
    <circle cx="865" cy="116" r="7" fill="#72e6ff"/>
    <circle cx="1138" cy="143" r="6" fill="#b48cff"/>
    <circle cx="1093" cy="272" r="5" fill="#72e6ff"/>
    <circle cx="874" cy="248" r="5" fill="#b48cff"/>
  </g>
  <path d="M58 278 C245 220 344 307 520 246 S760 193 842 226" fill="none" stroke="url(#line)" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="112" fill="#72e6ff" font-size="16" font-weight="700" letter-spacing="4">SYSTEMS · QUANTUM · TRADING · GOVERNANCE</text>
    <text x="70" y="174" fill="#f1f7ff" font-size="42" font-weight="760">Mopati Ramaologa</text>
    <text x="72" y="216" fill="#a9bed1" font-size="21">Systems Architect · Quantum Computing Researcher</text>
    <text x="72" y="247" fill="#a9bed1" font-size="21">Algorithmic Trading Engineer · Governed AI Builder</text>
    <text x="72" y="315" fill="#6f8ca6" font-size="14" letter-spacing="1.4">STATE → EVOLUTION → AUTHORITY → LAWFUL COLLAPSE → EVIDENCE</text>
